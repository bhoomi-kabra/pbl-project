<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background-color: #fafcfb; font-family: 'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#04392e" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#04392e" flood-opacity="0.04"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#044335"/>
      <stop offset="100%" stop-color="#0d6e59"/>
    </linearGradient>
    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c25e38"/>
      <stop offset="100%" stop-color="#d9774a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>

  <!-- Background Graphics -->
  <rect width="1920" height="1080" fill="#fafcfb" />
  <path d="M 0,0 L 1000,0 L 880,540 L 0,540 Z" fill="#e6f7f2" opacity="0.85"/>
  <path d="M 1120,400 L 1920,300 L 1920,1080 L 980,1080 Z" fill="#fdf0e6" opacity="0.85"/>
  <circle cx="800" cy="880" r="110" fill="#cbf2e5" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="1780" cy="220" r="85" fill="#fce4d6" opacity="0.7" filter="url(#softGlow)"/>

  <!-- Slide Header -->
  <text x="90" y="90" fill="#00382b" font-size="40" font-weight="800" letter-spacing="-0.5">Value Proposition &amp; Business Fit</text>
  <text x="90" y="130" fill="#065f46" font-size="22" font-weight="600">Bridging Citizens, Municipal Administration &amp; Contractors for Smart City Governance</text>
  <text x="90" y="165" fill="#4b635c" font-size="15" font-weight="400">Triple-stakeholder accountability model aligned with Ministry of Housing and Urban Affairs (MoHUA) Smart City Standards</text>

  <!-- Top Right Page Indicator -->
  <text x="1800" y="80" fill="#00382b" font-size="16" font-weight="500" text-anchor="end">Page</text>
  <text x="1800" y="122" fill="#00382b" font-size="44" font-weight="800" text-anchor="end">05</text>

  <!-- 3 STAKEHOLDER CARDS (TOP HALF) -->

  <!-- Stakeholder 1: Citizens -->
  <g transform="translate(90, 210)">
    <rect width="550" height="340" rx="16" fill="#ffffff" stroke="#cbe5dc" stroke-width="1.5" filter="url(#cardShadow)"/>
    <path d="M 0,16 A 16,16 0 0,1 16,0 L 534,0 A 16,16 0 0,1 550,16 L 550,52 L 0,52 Z" fill="url(#mintGrad)" />
    <text x="25" y="33" fill="#ffffff" font-size="13" font-weight="800" letter-spacing="1">VALUE PROP 01</text>
    <text x="160" y="33" fill="#d1fae5" font-size="15" font-weight="700">For Citizens &amp; Residents</text>

    <text x="25" y="88" fill="#00382b" font-size="17" font-weight="800">🗣️ Empowered Civic Voice &amp; Transparency</text>
    
    <rect x="25" y="105" width="500" height="60" rx="8" fill="#f2fcf8" stroke="#d0ebd7" stroke-width="1"/>
    <text x="40" y="128" fill="#044335" font-size="13" font-weight="700">🤖 1-Click Conversational AI Reporting</text>
    <text x="40" y="148" fill="#374151" font-size="11">No complex form filling; photo &amp; Marathi/Eng text auto-populates complaint</text>

    <rect x="25" y="175" width="500" height="60" rx="8" fill="#f2fcf8" stroke="#d0ebd7" stroke-width="1"/>
    <text x="40" y="198" fill="#044335" font-size="13" font-weight="700">🔍 "Closed != Resolved" Audit Power</text>
    <text x="40" y="218" fill="#374151" font-size="11">Citizens review side-by-side Before/After geotagged proof before ticket closes</text>

    <rect x="25" y="245" width="500" height="60" rx="8" fill="#f2fcf8" stroke="#d0ebd7" stroke-width="1"/>
    <text x="40" y="268" fill="#044335" font-size="13" font-weight="700">🏆 Gamified Civic Engagement Score</text>
    <text x="40" y="288" fill="#059669" font-size="11" font-weight="700">Earn +50 points per audit vote to climb Nashik Civic Leaderboards</text>
  </g>

  <!-- Stakeholder 2: Municipal Corp -->
  <g transform="translate(685, 210)">
    <rect width="550" height="340" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" filter="url(#cardShadow)"/>
    <path d="M 0,16 A 16,16 0 0,1 16,0 L 534,0 A 16,16 0 0,1 550,16 L 550,52 L 0,52 Z" fill="url(#peachGrad)" />
    <text x="25" y="33" fill="#ffffff" font-size="13" font-weight="800" letter-spacing="1">VALUE PROP 02</text>
    <text x="160" y="33" fill="#ffedd5" font-size="15" font-weight="700">For NMC &amp; Ward Engineers</text>

    <text x="25" y="88" fill="#7c2d12" font-size="17" font-weight="800">🏛️ Real-Time Governance &amp; SLA Control</text>

    <rect x="25" y="105" width="500" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="40" y="128" fill="#9a3412" font-size="13" font-weight="700">🗺️ 6 Wards Central GIS Dashboard</text>
    <text x="40" y="148" fill="#374151" font-size="11">Real-time socket map pins across Panchavati, Nashik East/West, Satpur, Cidco</text>

    <rect x="25" y="175" width="500" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="40" y="198" fill="#9a3412" font-size="13" font-weight="700">🚨 Automated SLA Escalation Engine</text>
    <text x="40" y="218" fill="#374151" font-size="11">Unresolved tickets auto-escalate to Chief Engineer &amp; Ward Officers</text>

    <rect x="25" y="245" width="500" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="40" y="268" fill="#9a3412" font-size="13" font-weight="700">📉 60% Reduction in Inspection Overhead</text>
    <text x="40" y="288" fill="#c25e38" font-size="11" font-weight="700">Crowdsourced verification replaces manual physical site visits</text>
  </g>

  <!-- Stakeholder 3: Contractors -->
  <g transform="translate(1280, 210)">
    <rect width="550" height="340" rx="16" fill="#ffffff" stroke="#0891b2" stroke-width="1.5" filter="url(#cardShadow)"/>
    <path d="M 0,16 A 16,16 0 0,1 16,0 L 534,0 A 16,16 0 0,1 550,16 L 550,52 L 0,52 Z" fill="url(#cyanGrad)" />
    <text x="25" y="33" fill="#ffffff" font-size="13" font-weight="800" letter-spacing="1">VALUE PROP 03</text>
    <text x="160" y="33" fill="#cffafe" font-size="15" font-weight="700">For Infrastructure Contractors</text>

    <text x="25" y="88" fill="#164e63" font-size="17" font-weight="800">📋 Defect Liability Period (DLP) Accountability</text>

    <rect x="25" y="105" width="500" height="60" rx="8" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
    <text x="40" y="128" fill="#155e75" font-size="13" font-weight="700">🛡️ 36-Month DLP Warranty Tracking</text>
    <text x="40" y="148" fill="#374151" font-size="11">Enforces warranty repairs under contractor obligation (L&amp;T, Eagle Infra)</text>

    <rect x="25" y="175" width="500" height="60" rx="8" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
    <text x="40" y="198" fill="#155e75" font-size="13" font-weight="700">📷 Transparent Milestone Proof Logs</text>
    <text x="40" y="218" fill="#374151" font-size="11">Prevents false contractor disputes via immutable EXIF geotagged photos</text>

    <rect x="25" y="245" width="500" height="60" rx="8" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
    <text x="40" y="268" fill="#155e75" font-size="13" font-weight="700">💰 Financial Deposit Retention Security</text>
    <text x="40" y="288" fill="#0891b2" font-size="11" font-weight="700">Non-compliance flags automatically penalize security deposit retentions</text>
  </g>


  <!-- BOTTOM SECTION: BUSINESS FIT & SMART CITY ALIGNMENT (ROW 2) -->
  <g transform="translate(90, 580)">
    <rect width="1740" height="400" rx="16" fill="#ffffff" stroke="#cbe5dc" stroke-width="1.5" filter="url(#cardShadow)"/>
    <path d="M 0,16 A 16,16 0 0,1 16,0 L 1724,0 A 16,16 0 0,1 1740,16 L 1740,56 L 0,56 Z" fill="url(#mintGrad)" />
    <text x="35" y="36" fill="#ffffff" font-size="14" font-weight="800" letter-spacing="1">STRATEGIC BUSINESS FIT</text>
    <text x="240" y="36" fill="#d1fae5" font-size="16" font-weight="700">Smart City Integration &amp; Municipal Cost Optimization Model</text>

    <!-- 3 Columns inside business fit -->
    <!-- Column 1: Market Fit -->
    <g transform="translate(35, 80)">
      <rect width="530" height="290" rx="12" fill="#f2fcf8" stroke="#d0ebd7" stroke-width="1"/>
      <text x="25" y="35" fill="#00382b" font-size="17" font-weight="800">🎯 National Smart City Alignment</text>
      <text x="25" y="65" fill="#374151" font-size="13">• Directly aligns with MoHUA Smart Cities Mission</text>
      <text x="25" y="90" fill="#374151" font-size="13">  and Urban Local Body (ULB) Service Benchmarks.</text>
      <text x="25" y="125" fill="#374151" font-size="13">• Scalable architecture deployment ready for all</text>
      <text x="25" y="150" fill="#374151" font-size="13">  27 Municipal Corporations across Maharashtra.</text>
      <text x="25" y="185" fill="#047857" font-size="13" font-weight="700">• GIS &amp; PostGIS compliant with National Spatial</text>
      <text x="25" y="210" fill="#047857" font-size="13" font-weight="700">  Data Infrastructure (NSDI) standards.</text>
    </g>

    <!-- Column 2: Cost Savings -->
    <g transform="translate(605, 80)">
      <rect width="530" height="290" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="25" y="35" fill="#7c2d12" font-size="17" font-weight="800">💡 Measurable Financial ROI</text>
      <text x="25" y="65" fill="#374151" font-size="13">• Eliminates ₹80L+ annual loss from premature</text>
      <text x="25" y="90" fill="#374151" font-size="13">  road re-tendering within contractor DLP period.</text>
      <text x="25" y="125" fill="#374151" font-size="13">• Prevents 100% of "Fake Ticket Closures" through</text>
      <text x="25" y="150" fill="#374151" font-size="13">  citizen side-by-side audit verification gate.</text>
      <text x="25" y="185" fill="#9a3412" font-size="13" font-weight="700">• Saves ~₹1.2 Cr annually in physical municipal</text>
      <text x="25" y="210" fill="#9a3412" font-size="13" font-weight="700">  ward inspection and audit overheads.</text>
    </g>

    <!-- Column 3: Revenue & Scalability -->
    <g transform="translate(1175, 80)">
      <rect width="530" height="290" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
      <text x="25" y="35" fill="#164e63" font-size="17" font-weight="800">🚀 Sustainability &amp; Revenue Model</text>
      <text x="25" y="65" fill="#374151" font-size="13">• B2G SaaS Licensing Model per Municipal Corp</text>
      <text x="25" y="90" fill="#374151" font-size="13">  (Tier-1 &amp; Tier-2 Smart Cities Annual License).</text>
      <text x="25" y="125" fill="#374151" font-size="13">• Data Analytics API for State PWD &amp; Infra</text>
      <text x="25" y="150" fill="#374151" font-size="13">  Planners (Road Quality Index feeds).</text>
      <text x="25" y="185" fill="#0891b2" font-size="13" font-weight="700">• Enterprise Contractor Performance Portal</text>
      <text x="25" y="210" fill="#0891b2" font-size="13" font-weight="700">  subscription for tender qualification scoring.</text>
    </g>
  </g>

  <!-- Slide Footer -->
  <text x="1830" y="1030" fill="#00382b" font-size="15" font-weight="800" text-anchor="end" letter-spacing="1.5">VALUE PROPOSITION &amp; BUSINESS FIT</text>

</svg>
