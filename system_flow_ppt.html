<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nashik Roads & Civic Monitor - PPT System Flow (16:9)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #111827;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .toolbar {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }
    .btn {
      background: #044335;
      color: #e6f7f2;
      border: 1px solid #0d6e59;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #0d6e59;
      color: #ffffff;
      transform: translateY(-1px);
    }
    .slide-wrapper {
      width: 100%;
      max-width: 1600px;
      aspect-ratio: 16 / 9;
      background: #fafcfb;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 100%;
      height: 100%;
    }
    @media print {
      body {
        background: none;
        padding: 0;
      }
      .toolbar {
        display: none;
      }
      .slide-wrapper {
        box-shadow: none;
        border-radius: 0;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="toolbar">

  <script>
    function downloadSVG() {
      const svgContent = document.querySelector('svg').outerHTML;
      const blob = new Blob([svgContent], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Nashik_Roads_PPT_System_Flow_16x9.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
